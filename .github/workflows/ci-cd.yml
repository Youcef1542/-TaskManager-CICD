name: TaskManager CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: Executer les tests
        run: python -m pytest -q

  docker:
    needs: tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Construire l'image Docker
        run: docker build -t taskmanager:ci .

      - name: Demarrer le conteneur
        run: docker run -d --name taskmanager-ci -p 8080:8000 taskmanager:ci

      - name: Verifier l'application
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:8080/health && curl -fsS http://localhost:8080/version; then
              exit 0
            fi
            sleep 2
          done
          docker logs taskmanager-ci
          exit 1

      - name: Arreter le conteneur
        if: always()
        run: docker stop taskmanager-ci || true

      - name: Connexion a GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Identifier l'image avec le commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker tag taskmanager:ci ghcr.io/youcef1542/taskmanager-cicd:${{ github.sha }}

      - name: Publier l'image sur GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/youcef1542/taskmanager-cicd:${{ github.sha }}